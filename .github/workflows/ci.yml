name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run fmt:check
      - name: Test
        run: npm test
